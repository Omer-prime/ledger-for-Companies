name: Windows release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: choice
        options: [staging, stable]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    environment: windows-package-review
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          $lines = & ./scripts/windows/Build-Package.ps1 -Version $env:VERSION -Channel $env:CHANNEL
          $lines | Write-Output
          $path = $lines[-1]
          "PACKAGE_PATH=$path" >> $env:GITHUB_ENV
          node --test tests/windows-release.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release-unsigned
          path: |
            ${{ env.PACKAGE_PATH }}/oarlinks.zip
            ${{ env.PACKAGE_PATH }}/release.json
          if-no-files-found: error
